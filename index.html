<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>El-Hay | الحي</title>
<style>
:root{--accent:#c9a24b;--bg:#0b0e11;--panel:rgba(15,20,24,.88);--text:#f1ece1;--dim:#a9a396;--border:rgba(201,162,75,.35);}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:'Segoe UI',Tahoma,sans-serif;color:var(--text)}
#c{position:fixed;inset:0;z-index:0}
#hud{position:fixed;top:10px;left:10px;z-index:5;font-size:12px;color:var(--dim);background:rgba(0,0,0,.5);padding:6px 10px;border-radius:6px;display:none;line-height:1.5}
#prompt{position:fixed;bottom:60px;left:50%;transform:translateX(-50%);z-index:6;background:rgba(0,0,0,.7);color:var(--accent);padding:8px 16px;border-radius:6px;font-size:14px;display:none;border:1px solid var(--border)}
#crosshair{position:fixed;top:50%;left:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:rgba(255,255,255,.8);z-index:5;display:none;pointer-events:none}
#loading{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--bg);gap:14px}
#lbTrack{width:240px;height:4px;background:rgba(255,255,255,.08);border-radius:2px;overflow:hidden}
#lbFill{width:0;height:100%;background:var(--accent);transition:width .2s}
#lbLabel{font-size:12px;color:var(--dim);letter-spacing:1px;text-align:center;direction:ltr}
#menu{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:linear-gradient(180deg,#05070a,#0b0e11 55%,#0a1213)}
#menuPanel{width:min(420px,88vw);padding:34px 28px;background:var(--panel);border:1px solid var(--border);border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.55)}
#menuPanel h1{font-size:32px;color:var(--accent);text-align:center;margin:0}
#menuPanel .sub{font-size:11px;color:var(--dim);text-align:center;letter-spacing:2px;margin:6px 0 24px}
.btn{display:block;width:100%;border:1px solid var(--border);background:rgba(255,255,255,.02);color:var(--text);padding:12px 16px;font-size:15px;border-radius:8px;cursor:pointer;text-align:inherit;margin-bottom:9px}
.btn:hover{background:rgba(201,162,75,.12);border-color:var(--accent)}
.btn.sm{font-size:12px;color:var(--dim);border-color:transparent;background:transparent;padding:6px 12px;width:auto;display:inline-block;margin:0 4px}
#menuFoot{display:flex;justify-content:center;margin-top:16px}
.panel{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;background:rgba(3,4,5,.72)}
.panel.open{display:flex}
.card{width:min(460px,90vw);max-height:80vh;overflow-y:auto;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:24px}
.card h2{margin:0 0 16px;color:var(--accent);font-size:17px}
.row{display:flex;justify-content:space-between;align-items:center;margin:12px 0;gap:10px;font-size:13px}
select{background:rgba(255,255,255,.05);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:5px 8px}
.close{margin-top:16px;width:100%;padding:10px;border-radius:8px;border:1px solid var(--accent);background:transparent;color:var(--accent);cursor:pointer}
#csLayer{position:fixed;inset:0;z-index:15;display:none;pointer-events:none}
.lb{position:absolute;left:0;right:0;height:12vh;background:#000}#lbTop{top:0}#lbBot{bottom:0}
#csSub{position:absolute;bottom:14vh;left:50%;transform:translateX(-50%);max-width:70vw;text-align:center;font-size:17px;color:#f5f0e6;text-shadow:0 2px 6px rgba(0,0,0,.8)}
#csCard{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#000;opacity:0;transition:opacity .8s;font-size:28px;color:var(--accent)}
#csCard.show{opacity:1}
#csSkip{position:absolute;bottom:22px;right:22px;pointer-events:auto;padding:7px 14px;border:1px solid var(--border);border-radius:6px;background:rgba(0,0,0,.4);color:var(--dim);cursor:pointer;font-size:12px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="crosshair"></div>
<div id="hud"></div>
<div id="prompt"></div>
<div id="loading"><div id="lbTrack"><div id="lbFill"></div></div><div id="lbLabel">جاري التحميل...</div></div>

<div id="menu"><div id="menuPanel">
<h1 id="mTitle">الحي</h1><div class="sub" id="mSub">CORE BUILD</div>
<button class="btn" id="bNew">بدء لعبة جديدة</button>
<button class="btn" id="bCont">استمرار اللعب</button>
<button class="btn" id="bSet">الإعدادات</button>
<div id="menuFoot"><button class="btn sm" id="bSup">الدعم</button><button class="btn sm" id="bPriv">الخصوصية</button><button class="btn sm" id="bTerm">الشروط</button></div>
</div></div>

<div class="panel" id="pSettings"><div class="card">
<h2 id="sTitle">الإعدادات</h2>
<div class="row"><span id="lLang">اللغة</span><select id="selLang"><option value="ar">العربية</option><option value="en">English</option><option value="fr">Français</option><option value="zh">中文</option></select></div>
<div class="row"><span id="lQual">الجودة</span><select id="selQual"><option value="low">Low</option><option value="med" selected>Medium</option><option value="high">High</option><option value="ultra">Ultra</option></select></div>
<div class="row"><span id="lFps">حد FPS</span><select id="selFps"><option value="30">30</option><option value="60" selected>60</option><option value="120">120</option><option value="0">Unlimited</option></select></div>
<div class="row"><span id="lShow">عرض FPS</span><input type="checkbox" id="chkFps"></div>
<div class="row"><span id="lCtrl">التحكم</span><select id="selCtrl"><option value="wasd">WASD</option><option value="arrows">Arrows</option></select></div>
<button class="close" id="sClose">إغلاق</button>
</div></div>

<div class="panel" id="pLegal"><div class="card"><h2 id="lgTitle">—</h2><p id="lgBody" style="color:var(--dim);font-size:13px;line-height:1.6">—</p><button class="close" id="lgClose">إغلاق</button></div></div>

<div id="csLayer"><div class="lb" id="lbTop"></div><div class="lb" id="lbBot"></div><div id="csSub"></div><div id="csCard"></div><button id="csSkip">تخطي</button></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ================= CONFIG ================= */
const LEGAL_DOCS={tos:"PLACEHOLDER Terms of Service.",priv:"PLACEHOLDER Privacy Policy.",sup:"PLACEHOLDER support@example.com"};

/* ================= I18N ================= */
const I18N={
ar:{dir:"rtl",loading:"جاري التحميل...",title:"الحي",sub:"CORE BUILD",newGame:"بدء لعبة جديدة",cont:"استمرار اللعب",set:"الإعدادات",sup:"الدعم",priv:"الخصوصية",term:"الشروط",close:"إغلاق",lang:"اللغة",qual:"الجودة",fps:"حد FPS",showfps:"عرض FPS",ctrl:"التحكم",skip:"تخطي",enterCar:"E: دخول السيارة",exitCar:"E: خروج",enterBld:"E: دخول",exitBld:"E: خروج",walk:"سير",drive:"قيادة",
cs1:"الساعة الواحدة ظهرًا.",cs2:"يتوجه نحو السيارة.",cs3:"الراديو يبث أغنية جزائرية.",cs4:"يتوقف لأخذ ابن عمه.",cs5:"حاجز تفتيش.",cs6:"يعثرون على شيء لا يخصه.",cs7:"بعد خمس سنوات...",cs8:"يخرج من بوابة السجن."},
en:{dir:"ltr",loading:"Loading...",title:"El-Hay",sub:"CORE BUILD",newGame:"Start New Game",cont:"Continue",set:"Settings",sup:"Support",priv:"Privacy",term:"Terms",close:"Close",lang:"Language",qual:"Quality",fps:"FPS Limit",showfps:"Show FPS",ctrl:"Controls",skip:"Skip",enterCar:"E: Enter Car",exitCar:"E: Exit",enterBld:"E: Enter",exitBld:"E: Exit",walk:"Walking",drive:"Driving",
cs1:"1:00 PM.",cs2:"He heads to the car.",cs3:"An old Algerian song plays.",cs4:"A stop to pick up his cousin.",cs5:"A checkpoint.",cs6:"They find something that isn't his.",cs7:"Five years later...",cs8:"He walks out the prison gate."}
};
function t(k){return (I18N[S.lang]||I18N.ar)[k]||k}
function applyLang(){
  document.documentElement.lang=S.lang;document.documentElement.dir=(I18N[S.lang]||I18N.ar).dir;
  mTitle.textContent=t('title');mSub.textContent=t('sub');bNew.textContent=t('newGame');bCont.textContent=t('cont');bSet.textContent=t('set');
  bSup.textContent=t('sup');bPriv.textContent=t('priv');bTerm.textContent=t('term');sTitle.textContent=t('set');lLang.textContent=t('lang');
  lQual.textContent=t('qual');lFps.textContent=t('fps');lShow.textContent=t('showfps');lCtrl.textContent=t('ctrl');sClose.textContent=t('close');
  lgClose.textContent=t('close');csSkip.textContent=t('skip');localStorage.setItem('elhay_lang',S.lang);
}

/* ================= SETTINGS ================= */
const S={lang:localStorage.getItem('elhay_lang')||'ar',qual:localStorage.getItem('elhay_qual')||'med',
 fpsLimit:parseInt(localStorage.getItem('elhay_fps')||'60'),showFps:localStorage.getItem('elhay_showfps')==='true',
 ctrl:localStorage.getItem('elhay_ctrl')||'wasd'};

/* ================= DOM ================= */
const $=id=>document.getElementById(id);
const canvas=$('c'),hud=$('hud'),promptEl=$('prompt'),crosshair=$('crosshair'),loading=$('loading'),lbFill=$('lbFill');
const menu=$('menu'),mTitle=$('mTitle'),mSub=$('mSub'),bNew=$('bNew'),bCont=$('bCont'),bSet=$('bSet'),bSup=$('bSup'),bPriv=$('bPriv'),bTerm=$('bTerm');
const pSettings=$('pSettings'),sTitle=$('sTitle'),lLang=$('lLang'),lQual=$('lQual'),lFps=$('lFps'),lShow=$('lShow'),lCtrl=$('lCtrl'),sClose=$('sClose');
const selLang=$('selLang'),selQual=$('selQual'),selFps=$('selFps'),chkFps=$('chkFps'),selCtrl=$('selCtrl');
const pLegal=$('pLegal'),lgTitle=$('lgTitle'),lgBody=$('lgBody'),lgClose=$('lgClose');
const csLayer=$('csLayer'),csSub=$('csSub'),csCard=$('csCard'),csSkip=$('csSkip');

/* ================= RENDERER / SCENE ================= */
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
const scene=new THREE.Scene();
scene.background=new THREE.Color(0xbfd4e6);
scene.fog=new THREE.Fog(0xbfd4e6,60,180);
const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,0.1,500);
const hemi=new THREE.HemisphereLight(0xdfe9f5,0x2a2015,0.7);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xffe6b8,1.3);sun.position.set(-40,60,-20);sun.castShadow=true;scene.add(sun);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});

/* ================= CAMERA POINTER-LOCK CONTROLLER (INTERNAL) ================= */
let isLocked = false;
let yaw = 0, pitch = 0;
document.addEventListener('pointerlockchange', ()=>{ isLocked = (document.pointerLockElement === document.body); });
document.addEventListener('mousemove', (e)=>{
  if(!isLocked) return;
  yaw -= e.movementX * 0.002;
  pitch -= e.movementY * 0.002;
  pitch = Math.max(-Math.PI/2.2, Math.min(Math.PI/2.2, pitch));
  camera.rotation.set(0, 0, 0);
  camera.rotation.y = yaw;
  camera.rotation.x = pitch;
});

/* ================= PALETTE TEXTURES ================= */
function canvasTex(draw,w=128,h=128){const cv=document.createElement('canvas');cv.width=w;cv.height=h;draw(cv.getContext('2d'),w,h);
 const tx=new THREE.CanvasTexture(cv);tx.wrapS=tx.wrapT=THREE.RepeatWrapping;return tx;}
const TEX={
 residential:canvasTex((g,w,h)=>{g.fillStyle='#d8b98a';g.fillRect(0,0,w,h);g.fillStyle='#c79f6b';for(let y=0;y<h;y+=16)g.fillRect(0,y,w,2);}),
 hospital:canvasTex((g,w,h)=>{g.fillStyle='#f2f6fa';g.fillRect(0,0,w,h);g.fillStyle='#2f6fb0';g.fillRect(0,h-18,w,18);g.fillStyle='#c0392b';g.fillRect(w/2-4,h/2-16,8,32);g.fillRect(w/2-16,h/2-4,32,8);}),
 police:canvasTex((g,w,h)=>{g.fillStyle='#5a5750';g.fillRect(0,0,w,h);g.fillStyle='#146b3a';g.fillRect(0,0,w,10);}),
 road:canvasTex((g,w,h)=>{g.fillStyle='#2b2b2e';g.fillRect(0,0,w,h);g.fillStyle='#e7c65a';g.fillRect(w/2-2,0,4,30);g.fillRect(w/2-2,60,4,30);},64,128),
 sidewalk:canvasTex((g,w,h)=>{g.fillStyle='#9c988c';g.fillRect(0,0,w,h);})
};
Object.values(TEX).forEach(tx=>{tx.repeat.set(2,2);});

/* ================= GROUND / ROADS ================= */
const groundMat=new THREE.MeshStandardMaterial({map:TEX.sidewalk,roughness:1});
const ground=new THREE.Mesh(new THREE.PlaneGeometry(1000,1000),groundMat);
ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
const roadMat=new THREE.MeshStandardMaterial({map:TEX.road,roughness:0.9});
function makeRoad(x,z,w,l,rotY){const m=new THREE.Mesh(new THREE.PlaneGeometry(w,l),roadMat);m.rotation.x=-Math.PI/2;m.rotation.z=rotY||0;
 m.position.set(x,0.01,z);m.receiveShadow=true;scene.add(m);}
makeRoad(0,0,12,1000,0); makeRoad(0,0,1000,12,Math.PI/2);

/* ================= LANDMARKS & CARS ================= */
function block(x,y,z,w,h,d,mat){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x,y+h/2,z);m.castShadow=true;m.receiveShadow=true;scene.add(m);return m;}
const matHosp=new THREE.MeshStandardMaterial({map:TEX.hospital});
const matPolice=new THREE.MeshStandardMaterial({map:TEX.police});
block(-40,0,-40,16,12,16,matHosp);
block(40,0,-40,16,10,16,matPolice);

const carBodyMat=new THREE.MeshStandardMaterial({color:0x274b52});
function makeCar(x,z){
 const g=new THREE.Group();
 const body=new THREE.Mesh(new THREE.BoxGeometry(2,0.8,4),carBodyMat);body.position.y=0.5;g.add(body);
 g.position.set(x,0,z);scene.add(g);return g;
}
const playerCar=makeCar(-10,10);

/* ================= PLAYER / INTERACTIONS ================= */
camera.position.set(30,1.7,55);
let mode='walk';
const move={f:false,b:false,l:false,r:false};

function bindKeys(){
 const map=()=>S.ctrl==='arrows'?{ArrowUp:'f',ArrowDown:'b',ArrowLeft:'l',ArrowRight:'r'}:{KeyW:'f',KeyS:'b',KeyA:'l',KeyD:'r'};
 addEventListener('keydown',e=>{const m=map();if(m[e.code])move[m[e.code]]=true; if(e.code==='KeyE') tryInteract();});
 addEventListener('keyup',e=>{const m=map();if(m[e.code])move[m[e.code]]=false;});
}
bindKeys();

canvas.addEventListener('click',()=>{
 if(menu.style.display==='none' && !document.querySelector('.panel.open') && csLayer.style.display!=='block') {
   document.body.requestPointerLock();
 }
});

function tryInteract(){
 if(mode==='walk'){
  if(camera.position.distanceTo(playerCar.position)<4){ mode='drive'; document.exitPointerLock(); crosshair.style.display='none'; }
 } else {
  mode='walk'; camera.position.set(playerCar.position.x+3,1.7,playerCar.position.z);
 }
}

let carSpeed = 0;
function updatePlayer(dt){
 if(mode==='walk' && isLocked){
  const dir = new THREE.Vector3();
  if(move.f) dir.z -= 1; if(move.b) dir.z += 1;
  if(move.l) dir.x -= 1; if(move.r) dir.x += 1;
  dir.normalize(); dir.applyAxisAngle(new THREE.Vector3(0,1,0), yaw);
  camera.position.addScaledVector(dir, 8 * dt);
  camera.position.y = 1.7;
 } else if(mode==='drive'){
  if(move.f) carSpeed = Math.min(carSpeed + dt*10, 15);
  else if(move.b) carSpeed = Math.max(carSpeed - dt*10, -5);
  else carSpeed *= 0.95;

  if(move.l) playerCar.rotation.y += dt * 1.5;
  if(move.r) playerCar.rotation.y -= dt * 1.5;

  playerCar.position.x += Math.sin(playerCar.rotation.y) * carSpeed * dt;
  playerCar.position.z += Math.cos(playerCar.rotation.y) * carSpeed * dt;

  camera.position.set(playerCar.position.x - Math.sin(playerCar.rotation.y)*7, playerCar.position.y + 3, playerCar.position.z - Math.cos(playerCar.rotation.y)*7);
  camera.lookAt(playerCar.position);
 }
}

function updatePrompt(){
 if(mode==='walk'){
  if(camera.position.distanceTo(playerCar.position)<4){ promptEl.textContent=t('enterCar'); promptEl.style.display='block'; }
  else promptEl.style.display='none';
 } else {
  promptEl.textContent=t('exitCar'); promptEl.style.display='block';
 }
}

/* ================= UI WIRING ================= */
selLang.value=S.lang;selQual.value=S.qual;selFps.value=String(S.fpsLimit);chkFps.checked=S.showFps;selCtrl.value=S.ctrl;
applyLang(); hud.style.display=S.showFps?'block':'none';
selLang.onchange=e=>{S.lang=e.target.value;applyLang();};
bSet.onclick=()=>pSettings.classList.add('open'); sClose.onclick=()=>pSettings.classList.remove('open');
bNew.onclick=()=>{menu.style.display='none'; crosshair.style.display='block'; document.body.requestPointerLock();};
bCont.onclick=()=>{menu.style.display='none'; crosshair.style.display='block'; document.body.requestPointerLock();};

/* ================= MAIN LOOP ================= */
let last=performance.now(), fpsCount=0, fpsSample=performance.now();
function loop(now){
 requestAnimationFrame(loop);
 const dt=Math.min((now-last)/1000, 0.1); last=now;
 updatePlayer(dt); updatePrompt();
 renderer.render(scene,camera);
 fpsCount++; if(now-fpsSample>=500){ if(S.showFps) hud.textContent='FPS: '+Math.round(fpsCount*1000/(now-fpsSample)); fpsCount=0; fpsSample=now; }
}
requestAnimationFrame(loop);

/* ================= BOOT ================= */
let pct=0; const bootId=setInterval(()=>{ pct+=20; lbFill.style.width=pct+'%';
 if(pct>=100){ clearInterval(bootId); loading.style.display='none'; menu.style.display='flex'; } },80);
</script>
</body>
</html>
