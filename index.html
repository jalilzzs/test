<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>El-Hay | الحي — Phase 1</title>

<!-- Standard non-module Three.js and Addons -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

<style>
  :root{
    --accent:#c9a24b;
    --accent-2:#0f3d3e;
    --bg-deep:#0b0e11;
    --panel:rgba(15,20,24,0.86);
    --text:#f1ece1;
    --text-dim:#a9a396;
    --border:rgba(201,162,75,0.35);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:var(--bg-deep);
    font-family:'Segoe UI','Tahoma',sans-serif;color:var(--text);}
  #app-canvas{position:fixed;inset:0;display:block;z-index:0;}
  #hud{position:fixed;top:12px;left:12px;z-index:5;font-size:12px;color:var(--text-dim);
    background:rgba(0,0,0,0.35);padding:6px 10px;border-radius:6px;display:none;}

  /* ---------- MAIN MENU ---------- */
  #menu-root{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;
    background:
      radial-gradient(ellipse at 50% 20%, rgba(201,162,75,0.10), transparent 60%),
      linear-gradient(180deg, #05070a 0%, #0b0e11 55%, #0a1213 100%);}
  #menu-root::before{
    content:"";position:absolute;inset:0;opacity:0.06;
    background-image:
      linear-gradient(45deg, var(--accent) 25%, transparent 25%, transparent 75%, var(--accent) 75%),
      linear-gradient(45deg, var(--accent) 25%, transparent 25%, transparent 75%, var(--accent) 75%);
    background-size:60px 60px;background-position:0 0, 30px 30px;pointer-events:none;}

  #menu-panel{position:relative;width:min(420px,88vw);padding:38px 30px 30px;
    background:var(--panel);border:1px solid var(--border);border-radius:14px;
    box-shadow:0 20px 60px rgba(0,0,0,0.55);backdrop-filter:blur(6px);}

  #title-block{text-align:center;margin-bottom:26px;}
  #title-ar{font-size:34px;letter-spacing:1px;color:var(--accent);margin:0;font-weight:600;}
  #title-sub{font-size:12px;color:var(--text-dim);margin-top:6px;letter-spacing:2px;}

  nav#menu-list{display:flex;flex-direction:column;gap:10px;}
  .menu-btn{appearance:none;border:1px solid var(--border);background:rgba(255,255,255,0.02);
    color:var(--text);padding:13px 16px;font-size:15px;border-radius:8px;cursor:pointer;
    text-align:inherit;transition:background .15s,border-color .15s,transform .1s;}
  .menu-btn:hover{background:rgba(201,162,75,0.12);border-color:var(--accent);}
  .menu-btn:active{transform:scale(0.98);}
  .menu-btn.secondary{font-size:13px;color:var(--text-dim);border-color:transparent;background:transparent;padding:8px 16px;}
  .menu-btn.secondary:hover{color:var(--text);background:rgba(255,255,255,0.04);}

  #menu-footer{display:flex;justify-content:space-between;margin-top:22px;gap:8px;flex-wrap:wrap;}

  /* ---------- PANELS ---------- */
  .overlay-panel{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;
    background:rgba(3,4,5,0.72);}
  .overlay-panel.open{display:flex;}
  .card{width:min(480px,90vw);max-height:80vh;overflow-y:auto;background:var(--panel);
    border:1px solid var(--border);border-radius:12px;padding:26px;box-shadow:0 20px 60px rgba(0,0,0,0.5);}
  .card h2{margin:0 0 18px;color:var(--accent);font-size:18px;font-weight:600;}
  .card p, .card label{color:var(--text-dim);font-size:13px;line-height:1.6;}
  .field-row{display:flex;align-items:center;justify-content:space-between;margin:14px 0;gap:12px;}
  .field-row span{font-size:13px;color:var(--text);}
  select, input[type="range"]{background:rgba(255,255,255,0.04);color:var(--text);
    border:1px solid var(--border);border-radius:6px;padding:6px 8px;font-size:13px;}
  .close-btn{margin-top:20px;width:100%;padding:11px;border-radius:8px;border:1px solid var(--accent);
    background:transparent;color:var(--accent);cursor:pointer;font-size:13px;}
  .close-btn:hover{background:rgba(201,162,75,0.12);}

  #loading-screen{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;
    justify-content:center;background:var(--bg-deep);gap:14px;}
  #loading-bar-track{width:240px;height:4px;background:rgba(255,255,255,0.08);border-radius:2px;overflow:hidden;}
  #loading-bar-fill{width:0%;height:100%;background:var(--accent);transition:width .2s;}
  #loading-label{font-size:12px;color:var(--text-dim);letter-spacing:1px;}

  /* ---------- CUTSCENE LAYER ---------- */
  #cutscene-layer{position:fixed;inset:0;z-index:15;display:none;pointer-events:none;}
  .letterbox{position:absolute;left:0;right:0;height:12vh;background:#000;}
  #letterbox-top{top:0;} #letterbox-bottom{bottom:0;}
  #cs-subtitle{position:absolute;bottom:14vh;left:50%;transform:translateX(-50%);
    max-width:70vw;text-align:center;font-size:17px;color:#f5f0e6;
    text-shadow:0 2px 6px rgba(0,0,0,0.8);letter-spacing:0.3px;}
  #cs-titlecard{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    background:#000;opacity:0;transition:opacity .8s;font-size:30px;color:var(--accent);letter-spacing:2px;}
  #cs-titlecard.show{opacity:1;}
  #cs-skip{position:absolute;bottom:24px;right:24px;pointer-events:auto;padding:8px 16px;
    border:1px solid var(--border);border-radius:6px;background:rgba(0,0,0,0.4);
    color:var(--text-dim);font-size:12px;cursor:pointer;}
  #cs-skip:hover{color:var(--text);border-color:var(--accent);}
  [dir="rtl"] #cs-skip{right:auto;left:24px;}
</style>
</head>
<body>

<canvas id="app-canvas"></canvas>
<div id="hud">FPS: <span id="fps-val">--</span></div>

<!-- LOADING SCREEN -->
<div id="loading-screen">
  <div id="loading-bar-track"><div id="loading-bar-fill"></div></div>
  <div id="loading-label" data-i18n="loading">جاري التحميل...</div>
</div>

<!-- MAIN MENU -->
<div id="menu-root" style="display:none;">
  <div id="menu-panel">
    <div id="title-block">
      <p id="title-ar" data-i18n="gameTitle">الحي</p>
      <p id="title-sub" data-i18n="gameSubtitle">PHASE 1 — TECH DEMO</p>
    </div>
    <nav id="menu-list">
      <button class="menu-btn" id="btn-new-game" data-i18n="newGame">بدء لعبة جديدة</button>
      <button class="menu-btn" id="btn-continue" data-i18n="continueGame">استمرار اللعب</button>
      <button class="menu-btn" id="btn-settings" data-i18n="settings">الإعدادات</button>
    </nav>
    <div id="menu-footer">
      <button class="menu-btn secondary" id="btn-support" data-i18n="support">الدعم</button>
      <button class="menu-btn secondary" id="btn-privacy" data-i18n="privacy">سياسة الخصوصية</button>
      <button class="menu-btn secondary" id="btn-terms" data-i18n="terms">شروط الاستخدام</button>
    </div>
  </div>
</div>

<!-- SETTINGS PANEL -->
<div class="overlay-panel" id="panel-settings">
  <div class="card">
    <h2 data-i18n="settings">الإعدادات</h2>

    <div class="field-row">
      <span data-i18n="language">اللغة</span>
      <select id="select-language">
        <option value="ar">العربية</option>
        <option value="en">English</option>
        <option value="fr">Français</option>
        <option value="zh">中文</option>
      </select>
    </div>

    <div class="field-row">
      <span data-i18n="graphicsQuality">جودة الرسوميات</span>
      <select id="select-quality">
        <option value="low">Low</option>
        <option value="med" selected>Medium</option>
        <option value="high">High</option>
        <option value="ultra">Ultra</option>
      </select>
    </div>

    <div class="field-row">
      <span data-i18n="fpsLimit">حد الإطارات (FPS)</span>
      <select id="select-fps">
        <option value="30">30</option>
        <option value="60" selected>60</option>
        <option value="120">120</option>
        <option value="0">Unlimited</option>
      </select>
    </div>

    <div class="field-row">
      <span data-i18n="showFps">عرض عداد FPS</span>
      <input type="checkbox" id="toggle-fps-display" />
    </div>

    <div class="field-row">
      <span data-i18n="controls">إعداد التحكم</span>
      <select id="select-controls">
        <option value="wasd">WASD + Mouse</option>
        <option value="arrows">Arrow Keys</option>
      </select>
    </div>

    <button class="close-btn" id="settings-close" data-i18n="close">إغلاق</button>
  </div>
</div>

<!-- CUTSCENE LAYER -->
<div id="cutscene-layer">
  <div class="letterbox" id="letterbox-top"></div>
  <div class="letterbox" id="letterbox-bottom"></div>
  <div id="cs-subtitle"></div>
  <div id="cs-titlecard"></div>
  <button id="cs-skip" data-i18n="skip">تخطي</button>
</div>

<!-- LEGAL / SUPPORT MODAL -->
<div class="overlay-panel" id="panel-legal">
  <div class="card">
    <h2 id="legal-title">—</h2>
    <p id="legal-body">—</p>
    <button class="close-btn" id="legal-close" data-i18n="close">إغلاق</button>
  </div>
</div>

<script>
/* =========================================================
   0. CONFIGURATION & PLACEHOLDERS
   ========================================================= */
const GOOGLE_CLIENT_ID = "";
const SUPABASE_URL = "";
const SUPABASE_ANON_KEY = "";

const LEGAL_DOCS = {
  termsOfService: "PLACEHOLDER — Terms of Service text goes here.",
  privacyPolicy: "PLACEHOLDER — Privacy Policy text goes here.",
  supportContact: "PLACEHOLDER — support@your-domain.example"
};

const STORY_LOCATIONS = {
  highSchoolName: "PLACEHOLDER_HIGH_SCHOOL_NAME",
  prisonName: "PLACEHOLDER_PRISON_NAME"
};

const ASSET_PATHS = {
  audio: "/public/audio/",
  billboards: "/public/textures/billboards/",
  models: "/public/models/"
};

/* =========================================================
   1. I18N
   ========================================================= */
const I18N = {
  ar: { dir:"rtl", loading:"جاري التحميل...", gameTitle:"الحي", gameSubtitle:"المرحلة الأولى — عرض تقني",
    newGame:"بدء لعبة جديدة", continueGame:"استمرار اللعب", settings:"الإعدادات",
    support:"الدعم", privacy:"سياسة الخصوصية", terms:"شروط الاستخدام", close:"إغلاق",
    language:"اللغة", graphicsQuality:"جودة الرسوميات", fpsLimit:"حد الإطارات (FPS)",
    showFps:"عرض عداد FPS", controls:"إعداد التحكم", skip:"تخطي",
    cs1:"الساعة الواحدة ظهرًا. حان وقت الخروج.",
    cs2:"يغلق الباب خلفه ويتوجه نحو السيارة.",
    cs3:"الطريق مزدحم، والراديو يبث أغنية جزائرية قديمة.",
    cs4:"يتوقف لأخذ ابن عمه من مكان عمله.",
    cs5:"حاجز تفتيش. رجال الشرطة يطلبون الوثائق.",
    cs6:"يعثرون على شيء في السيارة لا يخصه. لا وقت للتفسير.",
    cs7:"بعد خمس سنوات...",
    cs8:"يخرج من بوابة السجن. الحي لم يتغير كثيرًا." },
  en: { dir:"ltr", loading:"Loading...", gameTitle:"El-Hay", gameSubtitle:"PHASE 1 — TECH DEMO",
    newGame:"Start New Game", continueGame:"Continue Playing", settings:"Settings",
    support:"Support", privacy:"Privacy Policy", terms:"Terms of Service", close:"Close",
    language:"Language", graphicsQuality:"Graphics Quality", fpsLimit:"FPS Limit",
    showFps:"Show FPS Counter", controls:"Controls Setup", skip:"Skip",
    cs1:"1:00 PM. Time to get moving.",
    cs2:"The door clicks shut behind him. The car's waiting.",
    cs3:"Traffic's thick, an old Algerian song drifts from the radio.",
    cs4:"A stop to pick up his cousin from work.",
    cs5:"A checkpoint. The officers ask for papers.",
    cs6:"They find something in the car that isn't his. There's no time to explain.",
    cs7:"Five years later...",
    cs8:"He walks out through the prison gate. The block hasn't changed much." },
  fr: { dir:"ltr", loading:"Chargement...", gameTitle:"El-Hay", gameSubtitle:"PHASE 1 — DÉMO TECH",
    newGame:"Nouvelle partie", continueGame:"Continuer", settings:"Paramètres",
    support:"Assistance", privacy:"Politique de confidentialité", terms:"Conditions d'utilisation", close:"Fermer",
    language:"Langue", graphicsQuality:"Qualité graphique", fpsLimit:"Limite FPS",
    showFps:"Afficher le compteur FPS", controls:"Configuration des contrôles", skip:"Passer",
    cs1:"13h00. Il est temps de partir.",
    cs2:"La porte se referme derrière lui. La voiture attend.",
    cs3:"La circulation est dense, une vieille chanson algérienne passe à la radio.",
    cs4:"Un arrêt pour récupérer son cousin au travail.",
    cs5:"Un barrage. Les agents demandent les papiers.",
    cs6:"Ils trouvent quelque chose dans la voiture qui n'est pas à lui. Pas le temps d'expliquer.",
    cs7:"Cinq ans plus tard...",
    cs8:"Il franchit la porte de la prison. Le quartier n'a pas beaucoup changé." },
  zh: { dir:"ltr", loading:"加载中...", gameTitle:"El-Hay", gameSubtitle:"第一阶段 — 技术演示",
    newGame:"开始新游戏", continueGame:"继续游戏", settings:"设置",
    support:"支持", privacy:"隐私政策", terms:"服务条款", close:"关闭",
    language:"语言", graphicsQuality:"画质", fpsLimit:"帧率限制",
    showFps:"显示帧率计数器", controls:"控制设置", skip:"跳过",
    cs1:"下午一点。该出发了。",
    cs2:"门在他身后关上。车已经在等着。",
    cs3:"路上很堵,收音机里播放着一首古老的阿尔及利亚歌曲。",
    cs4:"停下来接他的表弟下班。",
    cs5:"一个检查站。警察要求查看证件。",
    cs6:"他们在车里发现了不属于他的东西。没时间解释。",
    cs7:"五年后...",
    cs8:"他走出监狱大门。这个街区变化不大。" }
};

function applyLanguage(code){
  const dict = I18N[code] || I18N.ar;
  document.documentElement.lang = code;
  document.documentElement.dir = dict.dir;
  document.querySelectorAll("[data-i18n]").forEach(el=>{
    const key = el.getAttribute("data-i18n");
    if (dict[key]) el.textContent = dict[key];
  });
  localStorage.setItem("elhay_lang", code);
}

/* =========================================================
   2. SETTINGS STATE
   ========================================================= */
const Settings = {
  language: localStorage.getItem("elhay_lang") || "ar",
  quality: localStorage.getItem("elhay_quality") || "med",
  fpsLimit: parseInt(localStorage.getItem("elhay_fpsLimit") || "60", 10),
  showFps: localStorage.getItem("elhay_showFps") === "true",
  controls: localStorage.getItem("elhay_controls") || "wasd",
};

/* =========================================================
   3. THREE.JS BASELINE SCENE
   ========================================================= */
const canvas = document.getElementById("app-canvas");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0e11);
scene.fog = new THREE.Fog(0x0b0e11, 30, 140);

const camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.1, 500);
camera.position.set(0, 1.7, 6);

const hemi = new THREE.HemisphereLight(0xbfd7ea, 0x2a1f14, 0.6);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffe3b0, 1.2);
sun.position.set(-20, 30, -10);
sun.castShadow = true;
scene.add(sun);

const groundGeo = new THREE.PlaneGeometry(400, 400);
const groundMat = new THREE.MeshStandardMaterial({ color: 0x2e2a24, roughness: 1 });
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI/2;
ground.receiveShadow = true;
scene.add(ground);

const buildingMat = new THREE.MeshStandardMaterial({ color: 0xd8c9a3, roughness: 0.85 });
for (let i=0;i<10;i++){
  const w = 4+Math.random()*3, h = 6+Math.random()*10, d = 4+Math.random()*3;
  const geo = new THREE.BoxGeometry(w,h,d);
  const mesh = new THREE.Mesh(geo, buildingMat);
  mesh.position.set((Math.random()-0.5)*80, h/2, (Math.random()-0.5)*80 - 10);
  mesh.castShadow = true; mesh.receiveShadow = true;
  scene.add(mesh);
}

/* =========================================================
   4. CAMERA CONTROLLER
   ========================================================= */
const controls = new THREE.PointerLockControls(camera, document.body);
const moveState = { forward:false, back:false, left:false, right:false };
const velocity = new THREE.Vector3();
const CAM_SPEED = 8;

function bindKeys(){
  const keyMapWASD = { KeyW:"forward", KeyS:"back", KeyA:"left", KeyD:"right" };
  const keyMapArrows = { ArrowUp:"forward", ArrowDown:"back", ArrowLeft:"left", ArrowRight:"right" };
  document.addEventListener("keydown", e=>{
    const map = Settings.controls === "arrows" ? keyMapArrows : keyMapWASD;
    if (map[e.code]) moveState[map[e.code]] = true;
  });
  document.addEventListener("keyup", e=>{
    const map = Settings.controls === "arrows" ? keyMapArrows : keyMapWASD;
    if (map[e.code]) moveState[map[e.code]] = false;
  });
}
bindKeys();

canvas.addEventListener("click", ()=>{
  if (document.getElementById("menu-root").style.display === "none" &&
      !document.querySelector(".overlay-panel.open")) {
    controls.lock();
  }
});

function updateCameraController(dt){
  velocity.set(0,0,0);
  if (moveState.forward) velocity.z -= 1;
  if (moveState.back)    velocity.z += 1;
  if (moveState.left)    velocity.x -= 1;
  if (moveState.right)   velocity.x += 1;
  if (velocity.lengthSq() > 0){
    velocity.normalize().multiplyScalar(CAM_SPEED * dt);
    controls.moveRight(velocity.x);
    controls.moveForward(-velocity.z);
  }
}

/* =========================================================
   5. RENDER LOOP
   ========================================================= */
let lastFrameTime = performance.now();
let lastFpsSample = performance.now();
let frameCount = 0;
const fpsValEl = document.getElementById("fps-val");
const hudEl = document.getElementById("hud");

function animate(now){
  requestAnimationFrame(animate);

  const targetInterval = Settings.fpsLimit > 0 ? 1000/Settings.fpsLimit : 0;
  const elapsed = now - lastFrameTime;
  if (elapsed < targetInterval) return;
  const dt = Math.min(elapsed/1000, 0.1);
  lastFrameTime = now;

  updateCameraController(dt);
  renderer.render(scene, camera);

  frameCount++;
  if (now - lastFpsSample >= 500){
    fpsValEl.textContent = Math.round((frameCount*1000)/(now-lastFpsSample));
    frameCount = 0; lastFpsSample = now;
  }
}
requestAnimationFrame(animate);

window.addEventListener("resize", ()=>{
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

/* =========================================================
   6. UI WIRING & PRELOADER
   ========================================================= */
const menuRoot = document.getElementById("menu-root");
const panelSettings = document.getElementById("panel-settings");
const panelLegal = document.getElementById("panel-legal");

applyLanguage(Settings.language);
hudEl.style.display = Settings.showFps ? "block" : "none";

document.getElementById("btn-settings").addEventListener("click", ()=> panelSettings.classList.add("open"));
document.getElementById("settings-close").addEventListener("click", ()=> panelSettings.classList.remove("open"));

document.getElementById("btn-new-game").addEventListener("click", ()=>{
  menuRoot.style.display = "none";
  controls.lock();
});

const loadingScreen = document.getElementById("loading-screen");
const loadingFill = document.getElementById("loading-bar-fill");

function fakePreload(){
  let pct = 0;
  const id = setInterval(()=>{
    pct += 15;
    loadingFill.style.width = Math.min(pct,100) + "%";
    if (pct >= 100){
      clearInterval(id);
      setTimeout(()=>{
        loadingScreen.style.display = "none";
        menuRoot.style.display = "flex";
      }, 200);
    }
  }, 100);
}
fakePreload();
</script>
</body>
</html>
