<style>

    --text-dim:#a9a396;
    --border:rgba(201,162,75,0.35);

  *{box-sizing:border-box;}

    font-family:'Segoe UI','Tahoma',sans-serif;color:var(--text);}
  #app-canvas{position:fixed;inset:0;display:block;z-index:0;}
  #hud{position:fixed;top:12px;left:12px;z-index:5;font-size:12px;color:var(--text-dim);
    background:rgba(0,0,0,0.35);padding:6px 10px;border-radius:6px;display:none;}

  /* ---------- MAIN MENU ---------- */
  #menu-root{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;
    background:
      radial-gradient(ellipse at 50% 20%, rgba(201,162,75,0.10), transparent 60%),
      linear-gradient(180deg, #05070a 0%, #0b0e11 55%, #0a1213 100%);}
  #menu-root::before{ /* subtle geometric tile texture using css, stands in for /textures/billboards art direction */
    content:"";position:absolute;inset:0;opacity:0.06;
    background-image:
      linear-gradient(45deg, var(--accent) 25%, transparent 25%, transparent 75%, var(--accent) 75%),
      linear-gradient(45deg, var(--accent) 25%, transparent 25%, transparent 75%, var(--accent) 75%);
    background-size:60px 60px;background-position:0 0, 30px 30px;pointer-events:none;}

  #menu-panel{position:relative;width:min(420px,88vw);padding:38px 30px 30px;
    background:var(--panel);border:1px solid var(--border);border-radius:14px;
    box-shadow:0 20px 60px rgba(0,0,0,0.55);backdrop-filter:blur(6px);}

  #title-block{text-align:center;margin-bottom:26px;}
  #title-ar{font-size:34px;letter-spacing:1px;color:var(--accent);margin:0;font-weight:600;}
  #title-sub{font-size:12px;color:var(--text-dim);margin-top:6px;letter-spacing:2px;}

  nav#menu-list{display:flex;flex-direction:column;gap:10px;}
  .menu-btn{appearance:none;border:1px solid var(--border);background:rgba(255,255,255,0.02);
    color:var(--text);padding:13px 16px;font-size:15px;border-radius:8px;cursor:pointer;
    text-align:inherit;transition:background .15s,border-color .15s,transform .1s;}
  .menu-btn:hover{background:rgba(201,162,75,0.12);border-color:var(--accent);}
  .menu-btn:active{transform:scale(0.98);}
  .menu-btn.secondary{font-size:13px;color:var(--text-dim);border-color:transparent;background:transparent;padding:8px 16px;}
  .menu-btn.secondary:hover{color:var(--text);background:rgba(255,255,255,0.04);}

  #menu-footer{display:flex;justify-content:space-between;margin-top:22px;gap:8px;flex-wrap:wrap;}

  /* ---------- PANELS (settings / legal) ---------- */
  .overlay-panel{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;
    background:rgba(3,4,5,0.72);}
  .overlay-panel.open{display:flex;}
  .card{width:min(480px,90vw);max-height:80vh;overflow-y:auto;background:var(--panel);
    border:1px solid var(--border);border-radius:12px;padding:26px;box-shadow:0 20px 60px rgba(0,0,0,0.5);}
  .card h2{margin:0 0 18px;color:var(--accent);font-size:18px;font-weight:600;}
  .card p, .card label{color:var(--text-dim);font-size:13px;line-height:1.6;}
  .field-row{display:flex;align-items:center;justify-content:space-between;margin:14px 0;gap:12px;}
  .field-row span{font-size:13px;color:var(--text);}
  select, input[type="range"]{background:rgba(255,255,255,0.04);color:var(--text);
    border:1px solid var(--border);border-radius:6px;padding:6px 8px;font-size:13px;}
  .close-btn{margin-top:20px;width:100%;padding:11px;border-radius:8px;border:1px solid var(--accent);
    background:transparent;color:var(--accent);cursor:pointer;font-size:13px;}
  .close-btn:hover{background:rgba(201,162,75,0.12);}

  #loading-screen{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;
    justify-content:center;background:var(--bg-deep);gap:14px;}
  #loading-bar-track{width:240px;height:4px;background:rgba(255,255,255,0.08);border-radius:2px;overflow:hidden;}
  #loading-bar-fill{width:0%;height:100%;background:var(--accent);transition:width .2s;}
  #loading-label{font-size:12px;color:var(--text-dim);letter-spacing:1px;}

  /* ---------- CUTSCENE LAYER ---------- */
  #cutscene-layer{position:fixed;inset:0;z-index:15;display:none;pointer-events:none;}
  .letterbox{position:absolute;left:0;right:0;height:12vh;background:#000;}
  #letterbox-top{top:0;} #letterbox-bottom{bottom:0;}
  #cs-subtitle{position:absolute;bottom:14vh;left:50%;transform:translateX(-50%);
    max-width:70vw;text-align:center;font-size:17px;color:#f5f0e6;
    text-shadow:0 2px 6px rgba(0,0,0,0.8);letter-spacing:0.3px;}
  #cs-titlecard{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    background:#000;opacity:0;transition:opacity .8s;font-size:30px;color:var(--accent);letter-spacing:2px;}
  #cs-titlecard.show{opacity:1;}
  #cs-skip{position:absolute;bottom:24px;right:24px;pointer-events:auto;padding:8px 16px;

    color:var(--text-dim);font-size:12px;cursor:pointer;}
  #cs-skip:hover{color:var(--text);border-color:var(--accent);}

<script>
  // Surface any startup failure instead of freezing silently on the loading screen.
  // The most common cause: opening this file directly as file:// — browsers block
  // ES module imports (the <script type="module"> below) under file://'s CORS rules.
  // Fix: serve the folder over http instead, e.g. `npx serve .` or
  // `python3 -m http.server`, then open the printed http://localhost URL.
  window.addEventListener("error", showBootError);
  window.addEventListener("unhandledrejection", e => showBootError(e.reason || e));
  function showBootError(err){
    const label = document.getElementById("loading-label");
    if (!label) return;
    label.innerHTML = "Startup error — likely opened via <code>file://</code>.<br>" +
      "Serve this folder over http (e.g. <code>npx serve .</code>) and reload.<br>" +
      "<small style='opacity:.6'>" + (err && (err.message || err)) + "</small>";
    label.style.color = "#e07a5f";
    label.style.textAlign = "center";
    label.style.direction = "ltr";
    const track = document.getElementById("loading-bar-track");
    if (track) track.style.display = "none";
  }
  // Watchdog: if we're still stuck on the loading screen after 6s with no error caught above,
  // something (usually the module import) silently failed to run at all — surface it anyway.
  setTimeout(()=>{
    const screen = document.getElementById("loading-screen");
    if (screen && screen.style.display !== "none"){
      showBootError({ message: "Timed out waiting for the game module to start." });
    }
  }, 6000);
</script>
<script type="module">

/* =========================================================

function applyLanguage(code){
  const dict = I18N[code] || I18N.ar;
  document.documentElement.lang = code;
  document.documentElement.dir = dict.dir;
  document.querySelectorAll("[data-i18n]").forEach(el=>{
    const key = el.getAttribute("data-i18n");
    if (dict[key]) el.textContent = dict[key];
  });
  localStorage.setItem("elhay_lang", code);
}

/* =========================================================
   2. SETTINGS STATE (persisted locally; Supabase sync = Phase 2+)
   ========================================================= */
const Settings = {
  language: localStorage.getItem("elhay_lang") || "ar",
  quality: localStorage.getItem("elhay_quality") || "med",
  fpsLimit: parseInt(localStorage.getItem("elhay_fpsLimit") || "60", 10),
  showFps: localStorage.getItem("elhay_showFps") === "true",
  controls: localStorage.getItem("elhay_controls") || "wasd",
};

/* =========================================================
   3. THREE.JS BASELINE SCENE
   ========================================================= */
const canvas = document.getElementById("app-canvas");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0e11);
scene.fog = new THREE.Fog(0x0b0e11, 30, 140);

const camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.1, 500);
camera.position.set(0, 1.7, 6);

// Lighting — warm low sun typical of North-African late-afternoon light
const hemi = new THREE.HemisphereLight(0xbfd7ea, 0x2a1f14, 0.6);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffe3b0, 1.2);
sun.position.set(-20, 30, -10);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
scene.add(sun);

// Ground plane placeholder (stand-in for city block, replaced by chunked terrain in Phase 2)
const groundGeo = new THREE.PlaneGeometry(400, 400);
const groundMat = new THREE.MeshStandardMaterial({ color: 0x2e2a24, roughness: 1 });
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI/2;
ground.receiveShadow = true;
scene.add(ground);

// A few placeholder blocks standing in for Algerian-style low-rise apartment buildings
const buildingMat = new THREE.MeshStandardMaterial({ color: 0xd8c9a3, roughness: 0.85 });
for (let i=0;i<10;i++){
  const w = 4+Math.random()*3, h = 6+Math.random()*10, d = 4+Math.random()*3;
  const geo = new THREE.BoxGeometry(w,h,d);
  const mesh = new THREE.Mesh(geo, buildingMat);
  mesh.position.set((Math.random()-0.5)*80, h/2, (Math.random()-0.5)*80 - 10);
  mesh.castShadow = true; mesh.receiveShadow = true;
  scene.add(mesh);
}

/* =========================================================
   3b. CUTSCENE PROPS (low-poly stand-ins; swap for real /public/models later)
   ========================================================= */
const props = {};

// House interior (bedroom box) — beat 1
props.house = new THREE.Group();
const wallMat = new THREE.MeshStandardMaterial({ color: 0xcbb894, roughness: 0.9 });

/* =========================================================

const CAM_SPEED = 8;

function bindKeys(){
  const keyMapWASD = { KeyW:"forward", KeyS:"back", KeyA:"left", KeyD:"right" };
  const keyMapArrows = { ArrowUp:"forward", ArrowDown:"back", ArrowLeft:"left", ArrowRight:"right" };
  document.addEventListener("keydown", e=>{
    const map = Settings.controls === "arrows" ? keyMapArrows : keyMapWASD;
    if (map[e.code]) moveState[map[e.code]] = true;
  });
  document.addEventListener("keyup", e=>{
    const map = Settings.controls === "arrows" ? keyMapArrows : keyMapWASD;
    if (map[e.code]) moveState[map[e.code]] = false;
  });
}
bindKeys();

canvas.addEventListener("click", ()=>{
  if (document.getElementById("menu-root").style.display === "none" &&
      !document.querySelector(".overlay-panel.open")) {
    controls.lock();
  }
});

function updateCameraController(dt){
  velocity.set(0,0,0);
  if (moveState.forward) velocity.z -= 1;
  if (moveState.back)    velocity.z += 1;
  if (moveState.left)    velocity.x -= 1;
  if (moveState.right)   velocity.x += 1;
  if (velocity.lengthSq() > 0){
    velocity.normalize().multiplyScalar(CAM_SPEED * dt);
    controls.moveRight(velocity.x);
    controls.moveForward(-velocity.z);
  }
}

/* =========================================================
   5. ASSET LOADER  (/public audio, textures/billboards, models)
   ========================================================= */
const AssetLoader = {
  gltfLoader: new GLTFLoader(),
  texLoader: new THREE.TextureLoader(),
  audioCache: {},
  textureCache: {},
  modelCache: {},

  async loadModel(fileName){
    if (this.modelCache[fileName]) return this.modelCache[fileName];
    return new Promise((resolve, reject)=>{
      this.gltfLoader.load(
        ASSET_PATHS.models + fileName,
        gltf => { this.modelCache[fileName] = gltf; resolve(gltf); },
        undefined,
        err => reject(err)
      );
    });
  },

  loadBillboardTexture(fileName){
    if (this.textureCache[fileName]) return this.textureCache[fileName];
    const tex = this.texLoader.load(ASSET_PATHS.billboards + fileName);
    tex.colorSpace = THREE.SRGBColorSpace;
    this.textureCache[fileName] = tex;
    return tex;
  },

  loadAudio(fileName){
    if (this.audioCache[fileName]) return this.audioCache[fileName];
    const audio = new Audio(ASSET_PATHS.audio + fileName);
    this.audioCache[fileName] = audio;
    return audio;
  }
};

/* =========================================================
   6. QUALITY PRESETS
   ========================================================= */
function applyQuality(level){
  const map = {
    low:  { pixelRatio: 1,   shadows: false, fog: 200 },
    med:  { pixelRatio: 1.5, shadows: true,  fog: 140 },
    high: { pixelRatio: 2,   shadows: true,  fog: 100 },
    ultra:{ pixelRatio: 2,   shadows: true,  fog: 60  },
  };
  const p = map[level] || map.med;
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, p.pixelRatio));
  renderer.shadowMap.enabled = p.shadows;
  scene.fog.far = p.fog;
}

/* =========================================================
   7. RENDER LOOP with FPS limiter + counter
   ========================================================= */
let lastFrameTime = performance.now();
let lastFpsSample = performance.now();
let frameCount = 0;
const fpsValEl = document.getElementById("fps-val");
const hudEl = document.getElementById("hud");

function animate(now){
  requestAnimationFrame(animate);

  const targetInterval = Settings.fpsLimit > 0 ? 1000/Settings.fpsLimit : 0;
  const elapsed = now - lastFrameTime;
  if (elapsed < targetInterval) return;
  const dt = Math.min(elapsed/1000, 0.1);
  lastFrameTime = now;

  updateCameraController(dt);
  renderer.render(scene, camera);

  frameCount++;
  if (now - lastFpsSample >= 500){
    fpsValEl.textContent = Math.round((frameCount*1000)/(now-lastFpsSample));
    frameCount = 0; lastFpsSample = now;
  }
}
requestAnimationFrame(animate);

window.addEventListener("resize", ()=>{
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

/* =========================================================
   7b. CUTSCENE MANAGER
   ---------------------------------------------------------
   NOTE ON STORY: beats cs4/cs5/cs6 use a placeholder arrest
   cause (a cousin pickup + contraband found at the checkpoint)
   in place of the scenario originally sketched in the brief.
   Swap the cs4–cs6 strings above (and STORY_LOCATIONS) once
   you've picked the real replacement beat.
   ========================================================= */
const csLayer = document.getElementById("cutscene-layer");
const csSubtitle = document.getElementById("cs-subtitle");
const csTitlecard = document.getElementById("cs-titlecard");
const csSkipBtn = document.getElementById("cs-skip");

// Each beat: camera from -> to (position + lookAt), duration (s), subtitle key, optional title-card text
const V3 = (x,y,z)=> new THREE.Vector3(x,y,z);
const cutsceneBeats = [
  { from:{pos:V3(-73,1.6,-19), look:V3(-70,1.2,-20)}, to:{pos:V3(-69,1.6,-21), look:V3(-71.5,1,-20)}, dur:4, sub:"cs1" },
  { from:{pos:V3(-69,1.6,-21), look:V3(-71.5,1,-20)}, to:{pos:V3(-66,1.7,-15), look:V3(-68,0.8,-16)}, dur:3.5, sub:"cs2" },
  { from:{pos:V3(-60,2.2,-10), look:V3(-30,1,0)},      to:{pos:V3(-30,2.2,10),  look:V3(-10,1,20)},   dur:5, sub:"cs3" },
  { from:{pos:V3(-24,2,20), look:V3(-20,1,30)},        to:{pos:V3(-18,2,26),   look:V3(-20,1,30)},    dur:3, sub:"cs4" },
  { from:{pos:V3(-14,2,22), look:V3(-20,1,30)},         to:{pos:V3(-16,1.6,28), look:V3(-19,1,30)},    dur:3.5, sub:"cs5" },
  { from:{pos:V3(-17,1.6,29), look:V3(-19,1,30.5)},    to:{pos:V3(-19,1.4,30.5),look:V3(-20,1,30.5)}, dur:4, sub:"cs6" },
  { titlecard:"cs7", dur:2.5 },
  { from:{pos:V3(30,1.7,66), look:V3(30,1.4,60)},      to:{pos:V3(30,1.7,58),  look:V3(30,1.4,55)},   dur:4, sub:"cs8", handoffAt:59 },
];

let csSkipped = false;
csSkipBtn.addEventListener("click", ()=>{ csSkipped = true; });

function lerpVec(a,b,t){ return a.clone().lerp(b,t); }

async function playBeat(beat){
  if (csSkipped) return;
  if (beat.titlecard){
    csSubtitle.textContent = "";
    csTitlecard.textContent = I18N[Settings.language][beat.titlecard] || "";
    csTitlecard.classList.add("show");
    await wait(beat.dur * 1000);
    csTitlecard.classList.remove("show");
    return;
  }
  csSubtitle.textContent = I18N[Settings.language][beat.sub] || "";
  const start = performance.now();
  const durMs = beat.dur * 1000;
  return new Promise(resolve=>{
    function step(){
      if (csSkipped) return resolve();
      const t = Math.min((performance.now()-start)/durMs, 1);
      camera.position.copy(lerpVec(beat.from.pos, beat.to.pos, t));
      camera.lookAt(lerpVec(beat.from.look, beat.to.look, t));
      if (t < 1) requestAnimationFrame(step); else resolve();
    }
    step();
  });
}
function wait(ms){ return new Promise(r=>setTimeout(r,ms)); }

async function playCutscene(){
  csSkipped = false;
  csLayer.style.display = "block";
  controls.unlock();
  for (const beat of cutsceneBeats){
    if (csSkipped) break;
    await playBeat(beat);
  }
  endCutscene();
}

function endCutscene(){
  csLayer.style.display = "none";
  csSubtitle.textContent = "";
  csTitlecard.classList.remove("show");
  // Hand player control off right outside the prison gate, per the brief.
  camera.position.set(30, 1.7, 55);
  camera.lookAt(30, 1.4, 40);
  hudEl.style.display = Settings.showFps ? "block" : "none";
  console.log("[Phase 2] Cutscene complete — player control handed off at the prison gate.");
}

/* =========================================================
   9. LOADING SEQUENCE — simulates asset preload, then shows menu
   ========================================================= */
const loadingScreen = document.getElementById("loading-screen");
const loadingFill = document.getElementById("loading-bar-fill");

function fakePreload(){
  let pct = 0;
  const id = setInterval(()=>{
    pct += 8 + Math.random()*10;
    loadingFill.style.width = Math.min(pct,100) + "%";
    if (pct >= 100){
      clearInterval(id);
      setTimeout(()=>{
        loadingScreen.style.display = "none";
        menuRoot.style.display = "flex";
      }, 200);
    }
  }, 120);
}
fakePreload();
